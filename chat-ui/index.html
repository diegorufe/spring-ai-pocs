<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring AI · Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0c0d0f;
    --surface:  #141518;
    --border:   #22252b;
    --accent:   #4ade80;
    --accent2:  #22d3ee;
    --muted:    #3a3f4a;
    --text:     #e8eaf0;
    --subtext:  #6b7280;
    --user-bg:  #1a2a1e;
    --ai-bg:    #111318;
    --font-ui:  'Syne', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:   12px;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }

  .logo {
    font-family: var(--font-ui);
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
    50%       { opacity: 0.6; box-shadow: 0 0 3px var(--accent); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .model-badge {
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 400;
    color: var(--accent);
    border: 1px solid #2a4a30;
    background: #0d1f10;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }

  /* ── Config bar ── */
  .config-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .config-label {
    font-size: 11px;
    color: var(--subtext);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .config-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    outline: none;
    transition: border-color .2s;
  }

  .config-input:focus { border-color: var(--accent); }

  select.config-input { cursor: pointer; }

  .config-sep { width: 1px; height: 20px; background: var(--border); }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .status-dot.error { background: #f87171; box-shadow: 0 0 6px #f87171; }
  .status-dot.loading { background: var(--accent2); animation: pulse 1s ease-in-out infinite; }

  #status-text { font-size: 11px; color: var(--subtext); }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 14px;
    animation: fadeUp .25s ease;
    max-width: 820px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai   { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-family: var(--font-ui);
    font-weight: 600;
  }

  .msg.user .avatar { background: var(--user-bg); border: 1px solid #2a4a30; color: var(--accent); }
  .msg.ai   .avatar { background: #111927; border: 1px solid #1a2a3a; color: var(--accent2); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.7;
    font-size: 13.5px;
    max-width: 680px;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .bubble pre {
    background: #0b0f14;
    border: 1px solid #2a2d35;
    padding: 12px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 10px 0;
  }

  .bubble ul {
    margin: 0px 0px 0px 2px;
    padding-left: 18px;
  }

  .bubble ol {
    margin: 0px 0px 0px 2px;
    padding-left: 18px;
  }

  .bubble li {
    margin: 0px 0px 0px 2px;
  }

  .bubble strong{
    font-weight: bold;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid #2a4a30;
    border-bottom-right-radius: 3px;
    color: #d4f5db;
  }

  .msg.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
    color: var(--text);
  }

  /* Cursor parpadeante durante stream */
  .cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: var(--accent2);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink .7s step-end infinite;
    border-radius: 1px;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* Tokens counter bajo bubble de AI */
  .meta {
    font-size: 10px;
    color: var(--subtext);
    margin-top: 5px;
    margin-left: 2px;
    font-family: var(--font-mono);
  }

  /* ── Empty state ── */
  #empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 12px;
    color: var(--subtext);
    pointer-events: none;
  }

  #empty .big {
    font-family: var(--font-ui);
    font-size: 36px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: -2px;
  }

  #empty .hint { font-size: 12px; letter-spacing: 0.5px; }

  /* ── Input area ── */
  .input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 820px;
    margin: 0 auto;
  }

  #user-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13.5px;
    padding: 11px 14px;
    border-radius: var(--radius);
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 160px;
    overflow-y: auto;
    line-height: 1.6;
    transition: border-color .2s;
  }

  #user-input:focus { border-color: var(--accent); }
  #user-input::placeholder { color: var(--muted); }

  #send-btn {
    width: 44px; height: 44px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #0a1a0d;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s, transform .1s;
  }

  #send-btn:hover:not(:disabled) { background: #6ee79a; transform: scale(1.05); }
  #send-btn:active:not(:disabled) { transform: scale(0.95); }
  #send-btn:disabled { background: var(--muted); cursor: not-allowed; color: #5a5a5a; }

  .footer-hint {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  /* ── System prompt toggle ── */
  details { flex-basis: 100%; }
  summary {
    font-size: 11px;
    color: var(--subtext);
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    user-select: none;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▸'; font-size: 9px; transition: transform .2s; }
  details[open] summary::before { transform: rotate(90deg); }
  #system-prompt {
    width: 100%;
    margin-top: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent2);
    color: var(--subtext);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    outline: none;
    resize: vertical;
    min-height: 60px;
  }
  #system-prompt:focus { color: var(--text); border-color: var(--accent2); }

  /* Code block básico dentro de burbuja */
  .bubble code {
    background: #1a1d23;
    border: 1px solid #2a2d35;
    border-radius: 4px;
    padding: 2px 5px;
    font-size: 12px;
    color: var(--accent2);
  }

  /* Checkbox estilo custom igual que inputs */
  input[type="checkbox"].config-input {
    appearance: none;
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    display: inline-block;
    vertical-align: middle;
    transition: border-color .2s, background .2s;
  }

  input[type="checkbox"].config-input:hover {
    border-color: var(--accent);
  }

  input[type="checkbox"].config-input:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* check interno */
  input[type="checkbox"].config-input:checked::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 5px;
    width: 11px;
    height: 12px;
    border: solid #0a1a0d;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    Spring AI Chat
  </div>
  <div class="header-right">
    <span class="model-badge" id="model-label">ollama</span>
  </div>
</header>

<div class="config-bar">
  <span class="config-label">Base URL</span>
  <input class="config-input" id="base-url" value="http://localhost:8080" style="width:200px" disabled>

  <div class="config-sep"></div>

  <span class="config-label">Endpoint</span>
  <select class="config-input" id="endpoint-select" onchange="updateEndpoint()">
    <option value="/chat/stream">POST /chat/stream (SSE)</option>
    <option value="/chat/sync">POST /chat/sync (sync)</option>
  </select>

  <div class="config-sep"></div>

  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">listo</span>

  <button onclick="clearChat()" style="margin-left:auto;background:none;border:1px solid var(--border);color:var(--subtext);font-family:var(--font-mono);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;letter-spacing:0.5px;">limpiar</button>
</div>

<div id="messages">
  <div id="empty">
    <div class="big">_</div>
    <div class="hint">escribe algo para empezar · SSE streaming en tiempo real</div>
  </div>
</div>

<div class="input-area">
  <div class="input-row" style="margin-top:10px;">
    <textarea id="user-input" placeholder="Pregunta algo… (Enter para enviar, Shift+Enter para nueva línea)" rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Enviar">
      &#9650;
    </button>
  </div>
  <div class="footer-hint">streaming via SSE · Spring AI + Ollama</div>
</div>
<script src="marked.min.js"></script>
<script>
  marked.setOptions({
    highlight: function (code, lang) {
      if (window.hljs) {
        return hljs.highlightAuto(code, [lang]).value;
      }
      return code;
    }
  });

  let streaming = false;
  let currentController = null;

  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('user-input');
  const sendBtn     = document.getElementById('send-btn');
  const statusDot   = document.getElementById('status-dot');
  const statusText  = document.getElementById('status-text');
  const emptyEl     = document.getElementById('empty');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function setStatus(state, text) {
    statusDot.className = 'status-dot' + (state ? ' ' + state : '');
    statusText.textContent = text;
  }

  function updateEndpoint() {}

  function getConfig() {
    return {
      baseUrl:  document.getElementById('base-url').value.replace(/\/$/, ''),
      endpoint: document.getElementById('endpoint-select').value
    };
  }

  function clearChat() {
    if (streaming && currentController) currentController.abort();
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyEl);
    emptyEl.style.display = 'flex';

    const cfg = getConfig();

    fetch(cfg.baseUrl + "/chat/clear", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      }
    })
    .catch(error => console.error("Error:", error));
  }

  function addMessage(role, text) {
    if (emptyEl.parentNode) emptyEl.style.display = 'none';

    const div = document.createElement('div');
    div.className = 'msg ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'TÚ' : 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addAiBubble() {
    if (emptyEl.parentNode) emptyEl.style.display = 'none';

    const div = document.createElement('div');
    div.className = 'msg ai';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    const meta = document.createElement('div');
    meta.className = 'meta';

    bubble.appendChild(cursor);
    div.appendChild(avatar);

    const right = document.createElement('div');
    right.style.display = 'flex';
    right.style.flexDirection = 'column';
    right.appendChild(bubble);
    right.appendChild(meta);

    div.appendChild(right);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    return { bubble, cursor, meta };
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    const cfg = getConfig();
    addMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';

    streaming = true;
    sendBtn.disabled = true;
    setStatus('loading', 'conectando…');

    const { bubble, cursor, meta } = addAiBubble();
    let fullText = '';
    let tokenCount = 0;
    const startTime = Date.now();

    const url = `${cfg.baseUrl}${cfg.endpoint}`;

    if (cfg.endpoint.includes('stream')) {
      // ── SSE Streaming ───────────────────────────────────────────────
      currentController = new AbortController();

      try {
        const res = await fetch(url, {
          method: "POST",
          signal: currentController.signal,
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            input: text
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);

        setStatus('loading', 'recibiendo…');

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const valueRaw = decoder.decode(value, { stream: true });

          // console.log("RAW:", JSON.stringify(valueRaw));

          buffer += valueRaw;

          // Parsear líneas SSE
          const lines = buffer.split('\n\n');
          buffer = lines.pop(); // guarda línea incompleta

          for (const line of lines) {
            if (line.includes('data:')) {
              const chunk = line.replace(/data:/g, '');
              if (chunk.trim() === '[DONE]') continue;

              // Spring AI puede enviar el texto directamente
              // o wrapeado en JSON según el endpoint
              let token = chunk;

              try {
                const parsed = JSON.parse(chunk);
                token = parsed.result?.output?.content
                     || parsed.choices?.[0]?.delta?.content
                     || parsed.content
                     || chunk;
              } catch {
                // texto plano, úsalo tal cual
              }

              if (token) {
                fullText += token;
                tokenCount++;

                // Actualizar burbuja sin el cursor
                const tmpCursor = bubble.querySelector('.cursor');
                // bubble.textContent = fullText;
                bubble.innerHTML =  marked.parse(fullText);
                if (tmpCursor) bubble.appendChild(tmpCursor);

                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                meta.textContent = `${tokenCount} tokens · ${elapsed}s`;
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            }
          }
        }

      } catch (err) {
        if (err.name === 'AbortError') {
          bubble.textContent = fullText || '(cancelado)';
          setStatus('', 'cancelado');
        } else {
          bubble.textContent = `⚠ Error: ${err.message}\n\nAsegúrate de que Spring Boot está corriendo en ${cfg.baseUrl} con CORS habilitado.`;
          setStatus('error', 'error');
        }
      }

    } else {
      // ── Síncrono GET ────────────────────────────────────────────────
      currentController = new AbortController();
      try {
        const res = await fetch(url, {
          method: "POST",
          signal: currentController.signal,
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            input: text
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        setStatus('loading', 'procesando…');
        const data = await res.text();
        fullText = data;

        bubble.innerHTML =  marked.parse(fullText);
        //bubble.textContent = fullText;
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        meta.textContent = `respuesta completa · ${elapsed}s`;

      } catch (err) {
        bubble.textContent = `⚠ Error: ${err.message}`;
        setStatus('error', 'error');
      }
    }

    // Finalizar
    cursor.remove();
    if (!fullText) {
      bubble.textContent = '(sin respuesta)';
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    if (tokenCount > 0) {
      const tps = (tokenCount / parseFloat(elapsed)).toFixed(1);
      meta.textContent = `${tokenCount} tokens · ${elapsed}s · ${tps} tok/s`;
    } else if (fullText) {
      meta.textContent = `${elapsed}s`;
    }

    streaming = false;
    sendBtn.disabled = false;
    currentController = null;
    setStatus('', 'listo');
    messagesEl.scrollTop = messagesEl.scrollHeight;
    inputEl.focus();
  }

  clearChat();

  function setModel() {

    const cfg = getConfig();

    fetch(cfg.baseUrl + "/chat/model")
    .then(response=> response.text())
    .then(data => document.getElementById('model-label').innerText = data )
    .catch(error => console.error("Error:", error));
  }

  setModel();
</script>

</body>
</html>
