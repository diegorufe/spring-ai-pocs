spring:
  application:
    name: chatmemory

  ai:
    ollama:
      base-url: http://localhost:11434   # URL por defecto de Ollama
      chat:
        options:
          model: llama3.2:3b # Bastante rapido pero impreciso
          #model: qwen2.5-coder:14b # Bastante preciso pero lento
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  datasource:
    url: jdbc:postgresql://localhost:5432/chatdb
    username: sa
    password: root


  web:
    resources:
      static-locations: file:./../chat-ui